# `docker compose -f deploy/docker-compose.yml up --build`
# Add `--profile monitoring` for Prometheus and Grafana. Set secrets in a .env beside this file.
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    ports: ["8000:8000"]
    environment:
      IMBUTO_ENV: ${IMBUTO_ENV:-development}
      IMBUTO_PHONE_HASH_KEY: ${IMBUTO_PHONE_HASH_KEY:-dev-only-key}
      IMBUTO_GATEWAY_TOKEN: ${IMBUTO_GATEWAY_TOKEN:-}
      IMBUTO_OPS_TOKEN: ${IMBUTO_OPS_TOKEN:-}
    volumes: [imbuto-data:/data]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]

volumes:
  imbuto-data:
