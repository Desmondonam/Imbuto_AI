<!doctype html><html lang="{{ 'fr' if lang=='fr' else ('en' if lang=='en' else 'rn') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Imbuto AI{% endblock %}</title><meta name="theme-color" content="#1f6e3f"><link rel="manifest" href="/static/manifest.json"><style>
body{margin:0;font:16px/1.45 system-ui,sans-serif;color:#1c2b22;background:#f7f8f4}header{background:#1f6e3f;color:#fff;padding:10px 14px}header a{color:#fff;text-decoration:none;font-weight:700;font-size:20px}nav.l{float:right;font-size:14px;padding-top:4px}nav.l a{font-size:14px;font-weight:400;margin-left:8px}main{max-width:560px;margin:auto;padding:12px 14px}.b{background:#fff3cd;padding:6px 14px;font-size:13px}.c{background:#fff;border:1px solid #dbe2d8;border-radius:8px;padding:12px;margin:0 0 12px}.m a{display:block;background:#fff;border:1px solid #dbe2d8;border-radius:8px;padding:14px;margin:0 0 8px;color:#1c2b22;font-weight:600;text-decoration:none}h1{font-size:21px;margin:6px 0 10px}button,select,input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:11px;margin:4px 0;border:1px solid #9aa89f;border-radius:6px}button{background:#1f6e3f;color:#fff;border:0;font-weight:600}.s{font-size:13px;color:#57655c}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #e3e8e0;text-align:left}{% block css %}{% endblock %}</style></head><body><header><nav class="l"><a href="?lang=rn">RN</a><a href="?lang=fr">FR</a><a href="?lang=en">EN</a></nav><a href="/">Imbuto AI</a></header>{% if demo %}<div class="b">{{ tr('demo_banner') }}</div>{% endif %}<main>{% block main %}{% endblock %}</main><script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')})</script>{% block js %}{% endblock %}</body></html>
